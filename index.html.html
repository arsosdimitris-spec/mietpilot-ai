<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10284a"><title>MietPilot AI</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17263c;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(135deg,#10284a,#245b91);color:white;padding:calc(22px + env(safe-area-inset-top)) 20px 28px;border-radius:0 0 28px 28px}.brand{font-weight:800;font-size:21px}.sub{opacity:.75;font-size:13px;margin-top:7px}main{max-width:680px;margin:auto;padding:18px 16px 110px}.panel{background:white;border:1px solid #e6ebf2;border-radius:18px;padding:17px;margin:0 0 14px;box-shadow:0 3px 14px #132b4610}.muted{color:#6d7b8d;font-size:13px}.big{font-size:30px;font-weight:800;margin:8px 0}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{font-size:22px;font-weight:800;margin-top:6px}.heading{font-size:21px;font-weight:800;margin:12px 0 16px}.btn{border:0;border-radius:11px;background:#175c9e;color:white;padding:11px 14px;font-weight:700}.btn.secondary{background:#e9f1fa;color:#174f87}.btn.danger{background:#fff0f0;color:#a42929}.btn.small{font-size:13px;padding:9px 11px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.pill{border-radius:50px;padding:5px 10px;font-size:12px;font-weight:700;background:#fff3db;color:#936200}.pill.paid{background:#e1f7e9;color:#197143}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce4ee;display:flex;justify-content:space-around;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:5}nav button{background:none;border:0;color:#66768b;font-size:11px;min-width:65px;padding:4px}nav button.active{color:#175c9e;font-weight:800}nav span{display:block;font-size:22px;margin-bottom:3px}.hide{display:none!important}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd6e4;border-radius:10px;background:white;color:#182d44}textarea{min-height:100px}dialog{width:calc(100% - 24px);max-width:520px;border:0;border-radius:20px;padding:20px;max-height:85vh;overflow:auto}dialog::backdrop{background:#0d1a2a99}h3{margin:0 0 8px}.empty{text-align:center;padding:28px 10px;color:#66768b}.notice{background:#e9f1fa;padding:12px;border-radius:12px;font-size:13px;color:#315274;margin-bottom:15px}.rowline{border-top:1px solid #e7edf4;padding-top:12px;margin-top:12px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#162d49;color:white;padding:12px 18px;border-radius:10px;z-index:20;display:none;max-width:90%;text-align:center}small{line-height:1.5}
</style></head><body><header><div class="brand">⌂ MietPilot AI</div><div class="sub">Dein smarter Vermieter-Assistent · Demo</div></header><main><div id="screen"></div></main><nav id="nav"><button data-tab="home" class="active"><span>⌂</span>Übersicht</button><button data-tab="damage"><span>🛠</span>Schäden</button><button data-tab="docs"><span>▤</span>Dokumente</button><button data-tab="letters"><span>✉</span>Schreiben</button></nav><dialog id="modal"><div class="flex"><h3 id="modalTitle"></h3><button class="btn secondary small" onclick="closeModal()">✕</button></div><div id="modalBody"></div></dialog><div class="toast" id="toast"></div><script>
const KEY='mietpilot-demo-v1';const initial={properties:[{id:1,name:'Lindenstraße 14',city:'Leipzig',units:3,rent:2150,paid:true},{id:2,name:'Gartenweg 7',city:'Hannover',units:1,rent:1180,paid:false},{id:3,name:'Marktplatz 3',city:'Erfurt',units:2,rent:1460,paid:true}],damages:[{id:11,propertyId:1,title:'Wasserfleck im Bad',date:'2026-11-10',status:'Offen',description:'Feuchtigkeit an der Decke prüfen'},{id:12,propertyId:2,title:'Fenstergriff defekt',date:'2026-11-14',status:'In Bearbeitung',description:'Handwerker kontaktieren'}],docs:[{id:21,title:'Muster-Mietvertrag',type:'Mietvertrag',propertyId:1,date:'2026-11-01'}]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){state=structuredClone(initial)}let tab='home';const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),prop=id=>state.properties.find(p=>p.id===Number(id)),propName=id=>prop(id)?.name||'Unbekannte Immobilie',save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Speichern im Browser nicht möglich')}render()},notify=s=>{let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2500)},openModal=(title,html)=>{$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()},closeModal=()=>$('#modal').close(),opts=(id)=>state.properties.map(p=>`<option value="${p.id}" ${p.id===Number(id)?'selected':''}>${esc(p.name)}</option>`).join('');
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';if(tab==='home'){let total=state.properties.reduce((a,p)=>a+p.rent,0),received=state.properties.filter(p=>p.paid).reduce((a,p)=>a+p.rent,0);out=`<div class="heading">Guten Tag 👋</div><div class="panel"><div class="muted">Eingegangene Miete · Demo</div><div class="big">${money(received)}</div><div class="muted">${money(total)} erwartet · ${money(total-received)} offen</div><div style="background:#e9eef5;border-radius:20px;height:9px;margin-top:15px"><div style="height:100%;width:${total?received/total*100:0}%;background:#2d87c8;border-radius:20px"></div></div></div><div class="grid"><div class="panel"><div class="muted">Immobilien</div><div class="metric">${state.properties.length}</div></div><div class="panel"><div class="muted">Offene Schäden</div><div class="metric">${state.damages.filter(d=>d.status!=='Erledigt').length}</div></div></div><div class="flex"><div class="heading">Deine Immobilien</div><button class="btn" onclick="propertyForm()">+ Hinzufügen</button></div>`;out+=state.properties.length?state.properties.map(p=>`<div class="panel"><div class="flex"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.city)} · ${p.units} Wohnung(en)</div></div><span class="pill ${p.paid?'paid':''}">${p.paid?'Bezahlt':'Offen'}</span></div><div class="rowline flex"><strong>${money(p.rent)} / Monat</strong><span class="muted">${state.damages.filter(d=>d.propertyId===p.id&&d.status!=='Erledigt').length} offene Schäden</span></div><div class="actions"><button class="btn secondary small" onclick="togglePaid(${p.id})">Als ${p.paid?'offen':'bezahlt'} markieren</button><button class="btn secondary small" onclick="propertyForm(${p.id})">Bearbeiten</button><button class="btn danger small" onclick="deleteProperty(${p.id})">Löschen</button>${!p.paid?`<button class="btn small" onclick="letterForm(${p.id},'Zahlungserinnerung')">Erinnerung schreiben</button>`:''}</div></div>`).join(''):'<div class="panel empty">Noch keine Immobilien. Tippe auf „Hinzufügen“.</div>'}
else if(tab==='damage'){out=`<div class="flex"><div class="heading">Schadensverwaltung</div><button class="btn" onclick="damageForm()">+ Schaden</button></div>`;out+=state.damages.length?state.damages.map(d=>`<div class="panel"><div class="flex"><b>${esc(d.title)}</b><span class="pill ${d.status==='Erledigt'?'paid':''}">${esc(d.status)}</span></div><div class="muted" style="margin-top:8px">${esc(propName(d.propertyId))} · ${esc(d.date)}</div><p>${esc(d.description)}</p><div class="actions"><button class="btn secondary small" onclick="damageForm(${d.id})">Bearbeiten</button><button class="btn danger small" onclick="deleteDamage(${d.id})">Löschen</button></div></div>`).join(''):'<div class="panel empty">Noch keine Schäden erfasst.</div>'}
else if(tab==='docs'){out=`<div class="flex"><div class="heading">Dokumentenübersicht</div><button class="btn" onclick="docForm()">+ Eintrag</button></div><div class="notice">Diese Demo speichert nur Dokumentnamen und Kategorien, keine echten Dateien. Bitte keine sensiblen Daten eingeben.</div>`;out+=state.docs.map(d=>`<div class="panel"><b>▤ ${esc(d.title)}</b><div class="muted" style="margin-top:7px">${esc(d.type)} · ${esc(propName(d.propertyId))} · ${esc(d.date)}</div><div class="actions"><button class="btn secondary small" onclick="docForm(${d.id})">Bearbeiten</button><button class="btn danger small" onclick="deleteDoc(${d.id})">Löschen</button></div></div>`).join('')||'<div class="panel empty">Noch keine Dokumenteinträge.</div>'}
else{out=`<div class="heading">Schreibassistent</div><div class="notice">Dies ist ein Vorlagen-Assistent, noch keine echte KI. Texte vor dem Versenden selbst prüfen. Keine Rechtsberatung.</div><div class="panel"><label>Immobilie</label><select id="letterProperty">${opts(state.properties[0]?.id)}</select><label>Art des Schreibens</label><select id="letterType"><option>Zahlungserinnerung</option><option>Schadensmeldung an Hausverwaltung</option><option>Handwerkeranfrage</option></select><label>Empfänger (optional)</label><input id="letterRecipient" placeholder="z. B. Frau Müller"><label>Zusätzliche Informationen (optional)</label><textarea id="letterExtra" placeholder="z. B. Schadensbeschreibung"></textarea><div class="actions"><button class="btn" onclick="generateLetter()">Schreiben erstellen</button></div></div><div id="letterOutput"></div>`}$('#screen').innerHTML=out}
function propertyForm(id){let p=prop(id)||{name:'',city:'',units:1,rent:'',paid:false};openModal(id?'Immobilie bearbeiten':'Immobilie hinzufügen',`<form id="propertyForm"><label>Name / Adresse</label><input name="name" required maxlength="100" value="${esc(p.name)}"><label>Stadt</label><input name="city" required maxlength="80" value="${esc(p.city)}"><label>Anzahl Wohnungen</label><input name="units" type="number" min="1" max="10000" required value="${p.units}"><label>Monatliche Gesamtmiete (€)</label><input name="rent" type="number" min="0" max="100000000" step="0.01" required value="${p.rent}"><label>Zahlungsstatus</label><select name="paid"><option value="false" ${!p.paid?'selected':''}>Offen</option><option value="true" ${p.paid?'selected':''}>Bezahlt</option></select><div class="actions"><button class="btn" type="submit">Speichern</button><button class="btn secondary" type="button" onclick="closeModal()">Abbrechen</button></div></form>`);$('#propertyForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:id||Date.now(),name:f.get('name').trim(),city:f.get('city').trim(),units:Number(f.get('units')),rent:Number(f.get('rent')),paid:f.get('paid')==='true'};if(id)state.properties=state.properties.map(x=>x.id===id?obj:x);else state.properties.push(obj);closeModal();save();notify('Immobilie gespeichert')}}
function togglePaid(id){let p=prop(id);if(p){p.paid=!p.paid;save();notify('Zahlungsstatus geändert')}}function deleteProperty(id){if(!confirm('Immobilie und zugehörige Schadens- und Dokumenteinträge löschen?'))return;state.properties=state.properties.filter(p=>p.id!==id);state.damages=state.damages.filter(d=>d.propertyId!==id);state.docs=state.docs.filter(d=>d.propertyId!==id);save()}
function damageForm(id){let d=state.damages.find(x=>x.id===id)||{propertyId:state.properties[0]?.id,title:'',date:new Date().toISOString().slice(0,10),status:'Offen',description:''};if(!state.properties.length){notify('Bitte zuerst eine Immobilie anlegen');return}openModal(id?'Schaden bearbeiten':'Schaden erfassen',`<form id="damageForm"><label>Immobilie</label><select name="propertyId">${opts(d.propertyId)}</select><label>Schaden</label><input name="title" required maxlength="100" value="${esc(d.title)}"><label>Datum</label><input name="date" type="date" required value="${esc(d.date)}"><label>Status</label><select name="status">${['Offen','In Bearbeitung','Erledigt'].map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select><label>Beschreibung</label><textarea name="description" maxlength="2000">${esc(d.description)}</textarea><div class="actions"><button class="btn">Speichern</button></div></form>`);$('#damageForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:id||Date.now(),propertyId:Number(f.get('propertyId')),title:f.get('title').trim(),date:f.get('date'),status:f.get('status'),description:f.get('description').trim()};if(id)state.damages=state.damages.map(x=>x.id===id?obj:x);else state.damages.push(obj);closeModal();save()}}
function deleteDamage(id){if(confirm('Schaden löschen?')){state.damages=state.damages.filter(d=>d.id!==id);save()}}
function docForm(id){let d=state.docs.find(x=>x.id===id)||{propertyId:state.properties[0]?.id,title:'',type:'Sonstiges',date:new Date().toISOString().slice(0,10)};if(!state.properties.length){notify('Bitte zuerst eine Immobilie anlegen');return}openModal(id?'Dokumenteintrag bearbeiten':'Dokumenteintrag hinzufügen',`<form id="docForm"><label>Dokumentname</label><input name="title" required maxlength="120" value="${esc(d.title)}"><label>Kategorie</label><select name="type">${['Mietvertrag','Rechnung','Schadensbericht','Nebenkosten','Sonstiges'].map(s=>`<option ${s===d.type?'selected':''}>${s}</option>`).join('')}</select><label>Immobilie</label><select name="propertyId">${opts(d.propertyId)}</select><label>Datum</label><input name="date" type="date" required value="${esc(d.date)}"><div class="actions"><button class="btn">Speichern</button></div></form>`);$('#docForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:id||Date.now(),propertyId:Number(f.get('propertyId')),title:f.get('title').trim(),type:f.get('type'),date:f.get('date')};if(id)state.docs=state.docs.map(x=>x.id===id?obj:x);else state.docs.push(obj);closeModal();save()}}
function deleteDoc(id){if(confirm('Dokumenteintrag löschen?')){state.docs=state.docs.filter(d=>d.id!==id);save()}}
function letterForm(id,type){tab='letters';render();$('#letterProperty').value=id;$('#letterType').value=type;generateLetter()}
function generateLetter(){let p=prop($('#letterProperty').value);if(!p){notify('Bitte zuerst eine Immobilie anlegen');return}let type=$('#letterType').value,recipient=$('#letterRecipient').value.trim()||'Damen und Herren',extra=$('#letterExtra').value.trim();let intro=`Guten Tag ${recipient},\n\n`,body=type==='Zahlungserinnerung'?`für die Immobilie ${p.name} in ${p.city} ist nach meinen Unterlagen eine Mietzahlung offen. Bitte prüfen Sie den Zahlungseingang und geben Sie mir eine kurze Rückmeldung.`:type==='Schadensmeldung an Hausverwaltung'?`ich möchte einen Schaden an der Immobilie ${p.name} in ${p.city} melden. Bitte bestätigen Sie den Eingang und teilen Sie mir die nächsten Schritte mit.`:`für die Immobilie ${p.name} in ${p.city} benötige ich Unterstützung bei einer Reparatur. Bitte teilen Sie mir mit, ob und wann ein Besichtigungstermin möglich ist.`;let result=`Betreff: ${type} – ${p.name}\n\n${intro}${body}${extra?'\n\nWeitere Angaben: '+extra:''}\n\nVielen Dank im Voraus.\n\nMit freundlichen Grüßen\n[Ihr Name]`;$('#letterOutput').innerHTML=`<div class="panel"><b>Dein Entwurf</b><textarea id="letterText" style="min-height:320px;margin-top:12px"></textarea><div class="actions"><button class="btn" onclick="copyLetter()">Text kopieren</button></div><small class="muted">Bitte Fakten und Fristen selbst überprüfen.</small></div>`;$('#letterText').value=result}
async function copyLetter(){let t=$('#letterText');try{await navigator.clipboard.writeText(t.value);notify('Text kopiert')}catch(e){t.select();notify('Text markiert – bitte kopieren')}}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
