<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MietPilot AI</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17263c;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(135deg,#10284a,#245b91);color:#fff;padding:25px 20px;border-radius:0 0 25px 25px}.brand{font-weight:800;font-size:22px}.sub{opacity:.8;font-size:13px;margin-top:6px}main{max-width:700px;margin:auto;padding:18px 16px 110px}.panel{background:white;border:1px solid #e6ebf2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #132b4610}.muted{color:#6d7b8d;font-size:13px}.heading{font-size:21px;font-weight:800;margin:12px 0 16px}.big{font-size:30px;font-weight:800;margin:8px 0}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:11px;background:#175c9e;color:white;padding:11px 14px;font-weight:700}.btn.secondary{background:#e9f1fa;color:#174f87}.btn.danger{background:#fff0f0;color:#a42929}.btn.small{font-size:13px;padding:9px 11px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.pill{border-radius:50px;padding:5px 10px;font-size:12px;font-weight:700;background:#fff3db;color:#936200}.pill.paid{background:#e1f7e9;color:#197143}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce4ee;display:flex;justify-content:space-around;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:5}nav button{background:none;border:0;color:#66768b;font-size:10px;flex:1;padding:4px 1px}nav button.active{color:#175c9e;font-weight:800}nav span{display:block;font-size:20px;margin-bottom:3px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd6e4;border-radius:10px;background:white;color:#182d44}textarea{min-height:100px}dialog{width:calc(100% - 24px);max-width:520px;border:0;border-radius:20px;padding:20px;max-height:85vh;overflow:auto}dialog::backdrop{background:#0d1a2a99}.notice{background:#e9f1fa;padding:12px;border-radius:12px;font-size:13px;color:#315274;margin-bottom:15px}.rowline{border-top:1px solid #e7edf4;padding-top:12px;margin-top:12px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#162d49;color:white;padding:12px 18px;border-radius:10px;z-index:20;display:none;max-width:90%}h3{margin:0 0 8px}small{line-height:1.5}
</style></head><body><header><div class="flex"><div><div class="brand">⌂ MietPilot AI</div><div class="sub">Dein smarter Vermieter-Assistent</div></div><button id="logout" class="btn secondary small" hidden>Abmelden</button></div></header><main><div id="screen"><div class="panel">Lade Anmeldung …</div></div></main><nav id="nav" hidden><button data-tab="home" class="active"><span>⌂</span>Übersicht</button><button data-tab="tenants"><span>👤</span>Mieter</button><button data-tab="damage"><span>🛠</span>Schäden</button><button data-tab="docs"><span>▤</span>Dokumente</button><button data-tab="letters"><span>✉</span>Schreiben</button><button data-tab="plans"><span>★</span>Tarife</button></nav><dialog id="modal"><div class="flex"><h3 id="modalTitle"></h3><button class="btn secondary small" onclick="closeModal()">✕</button></div><div id="modalBody"></div></dialog><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const SUPABASE_URL='https://voxxxheciwlieivkblmv.supabase.co';
const SUPABASE_KEY='sb_publishable_oPh2JqnmRuFxYKNgbQNViQ_vU3Ma_pR';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
let client,user=null,tab='home',state={properties:[],damages:[],docs:[],paid:{},payments:[],tenants:[],files:[]},demoPlan='free',busy=false;
const currentMonth=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
let selectedMonth=currentMonth();
const monthDate=()=>selectedMonth+'-01';
const paymentFor=id=>state.payments.find(p=>p.property_id===id&&p.month===monthDate());
const isPaid=id=>!!paymentFor(id)?.paid;
const amountFor=p=>Number(paymentFor(p.id)?.amount??p.rent);
function monthLabel(){let [y,m]=selectedMonth.split('-').map(Number);return new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))}
function changeMonth(value){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(value))return;selectedMonth=value;render()}
function notify(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function localKey(){return 'mietpilot-personal-'+user.id}
function loadLocal(){try{let d=JSON.parse(localStorage.getItem(localKey())||'{}');state.damages=d.damages||[];state.docs=d.docs||[];state.paid={};demoPlan=d.plan||'free'}catch{state.damages=[];state.docs=[];state.paid={}}}
function saveLocal(){localStorage.setItem(localKey(),JSON.stringify({damages:state.damages,docs:state.docs,plan:demoPlan}));render()}
function prop(id){return state.properties.find(p=>p.id===id)}
function propName(id){return prop(id)?.name||'Unbekannte Immobilie'}
function opts(id){return state.properties.map(p=>`<option value="${esc(p.id)}" ${p.id===id?'selected':''}>${esc(p.name)}</option>`).join('')}
function fail(e){console.error(e);notify('Fehler: '+(e.message||'Unbekannt'))}
async function refresh(){const [pr,pa,te]=await Promise.all([client.from('properties').select('id,name,address,monthly_rent,created_at').order('created_at',{ascending:true}),client.from('rent_payments').select('id,property_id,user_id,month,amount,paid,created_at').eq('user_id',user.id).order('month',{ascending:false}),client.from('tenants').select('id,user_id,property_id,full_name,lease_start,base_rent,utilities,deposit,created_at').eq('user_id',user.id).order('created_at',{ascending:true})]);if(te.error)throw te.error;state.tenants=te.data||[];if(pr.error)throw pr.error;if(pa.error)throw pa.error;state.payments=pa.data||[];state.properties=(pr.data||[]).map(p=>({...p,city:p.address||'',rent:Number(p.monthly_rent)}));await loadFiles();render()}
const DOC_BUCKET='documents';
  async function loadFiles(){
  const files = new Map();
  for(const p of state.properties){
    const {data,error} = await client.storage
      .from(DOC_BUCKET)
      .list(user.id+'/'+p.id,{
        limit:100,
        sortBy:{column:'created_at',order:'desc'}
      });
    if(error) throw error;
    for(const f of data||[]){
      if(!f.id) continue;
      const path = user.id+'/'+p.id+'/'+f.name;
      files.set(path,{
        path,
        propertyId:p.id,
        name:f.name,
        created_at:f.created_at
      });
    }
  }
  state.files = Array.from(files.values());
}
async function uploadDocument(event){event.preventDefault();if(busy)return;const f=new FormData(event.target),file=f.get('file'),propertyId=String(f.get('propertyId'));if(!prop(propertyId)){notify('Bitte zuerst eine Immobilie auswählen');return}if(!(file instanceof File)||!file.size){notify('Bitte Datei auswählen');return}if(file.size>10*1024*1024){notify('Maximal 10 MB pro Datei');return}const ext=(file.name.split('.').pop()||'').toLowerCase(),allowed=['pdf','png','jpg','jpeg','webp'];if(!allowed.includes(ext)){notify('Nur PDF, JPG, PNG oder WebP erlaubt');return}busy=true;try{const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-90);const path=user.id+'/'+propertyId+'/'+crypto.randomUUID()+'_'+safeName;const {error}=await client.storage.from(DOC_BUCKET).upload(path,file,{contentType:file.type||({pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'}[ext]),upsert:false});if(error)throw error;closeModal();await loadFiles();render();notify('Datei privat gespeichert')}catch(e){fail(e)}finally{busy=false}}
function uploadForm(){if(!state.properties.length){notify('Bitte zuerst eine Immobilie anlegen');return}openModal('Datei hochladen',`<form id="uploadForm"><label>Immobilie</label><select name="propertyId" required>${opts(state.properties[0].id)}</select><label>PDF oder Bild (max. 10 MB)</label><input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp" required><div class="actions"><button class="btn" type="submit">Privat hochladen</button></div></form>`);$('#uploadForm').onsubmit=uploadDocument}
async function openDocument(path){try{const {data,error}=await client.storage.from(DOC_BUCKET).createSignedUrl(path,60);if(error)throw error;window.open(data.signedUrl,'_blank','noopener,noreferrer')}catch(e){fail(e)}}
async function deleteDocument(path){if(!confirm('Datei endgültig löschen?'))return;try{const {error}=await client.storage.from(DOC_BUCKET).remove([path]);if(error)throw error;await loadFiles();render();notify('Datei gelöscht')}catch(e){fail(e)}}
function renderAuth(){document.querySelector('#nav').hidden=true;$('#logout').hidden=true;$('#screen').innerHTML=`<div class="heading">Willkommen bei MietPilot AI</div><div class="panel"><h3>Anmelden oder registrieren</h3><p class="muted">Verwalte deine Immobilien mit deinem eigenen Benutzerkonto.</p><form id="authForm"><label>E-Mail-Adresse</label><input type="email" name="email" autocomplete="email" required><label>Passwort (mindestens 6 Zeichen)</label><input type="password" name="password" minlength="6" autocomplete="current-password" required><div class="actions"><button class="btn" type="submit" value="login">Anmelden</button><button class="btn secondary" type="button" id="signup">Registrieren</button></div></form><p class="muted">Nach der Registrierung musst du möglicherweise den Bestätigungslink in deiner E-Mail öffnen.</p><div class="actions"><button class="btn secondary small" id="resetPassword">Passwort vergessen?</button></div></div>`;$('#authForm').onsubmit=e=>{e.preventDefault();authAction('login')};$('#signup').onclick=()=>authAction('signup');$('#resetPassword').onclick=async()=>{let email=$('#authForm').elements.email.value.trim();if(!email){notify('Bitte zuerst E-Mail eingeben');return}let {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)fail(error);else notify('Falls die Adresse registriert ist, kommt eine E-Mail')}}
async function authAction(kind){if(busy)return;let f=$('#authForm'),email=f.elements.email.value.trim(),password=f.elements.password.value;if(!f.reportValidity())return;busy=true;try{let r=kind==='signup'?await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(kind==='signup'&&!r.data.session)notify('Bitte bestätige deine E-Mail und melde dich dann an');else notify('Erfolgreich angemeldet')}catch(e){fail(e)}finally{busy=false}}
async function sessionChanged(session){user=session?.user||null;state={properties:[],damages:[],docs:[],paid:{},payments:[],tenants:[],files:[]};if(!user){renderAuth();return}$('#nav').hidden=false;$('#logout').hidden=false;loadLocal();$('#screen').innerHTML='<div class="panel">Lade deine Immobilien …</div>';try{await refresh()}catch(e){fail(e);$('#screen').innerHTML='<div class="panel">Die Immobilien konnten nicht geladen werden. Bitte prüfe die Datenbankberechtigungen und lade die Seite neu.</div>'}}
function render(){if(!user)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';if(tab==='home'){let total=state.properties.reduce((a,p)=>a+amountFor(p),0),received=state.properties.filter(p=>isPaid(p.id)).reduce((a,p)=>a+amountFor(p),0);out=`<div class="heading">Guten Tag 👋</div><div class="notice">Immobilien und Mietzahlungsstatus werden in Supabase gespeichert. Nicht erfasste Monate gelten in dieser Übersicht als offen. Keine Bankanbindung und keine automatische Zahlungsprüfung. Alte lokale Bezahlt-Markierungen wurden nicht automatisch übernommen.</div><div class="panel"><label for="paymentMonth">Mietmonat auswählen</label><input id="paymentMonth" type="month" value="${selectedMonth}" onchange="changeMonth(this.value)"><div class="muted" style="margin-top:10px">Mietübersicht für ${esc(monthLabel())}</div><div class="big">${money(received)} bezahlt</div><div class="muted">${money(total)} erwartet · ${money(total-received)} offen</div></div><div class="grid"><div class="panel"><div class="muted">Immobilien</div><div class="big">${state.properties.length}</div></div><div class="panel"><div class="muted">Offene Schäden</div><div class="big">${state.damages.filter(d=>d.status!=='Erledigt').length}</div></div></div><div class="flex"><div class="heading">Deine Immobilien</div><button class="btn small" onclick="propertyForm()">+ Hinzufügen</button></div>`;out+=state.properties.map(p=>`<div class="panel"><div class="flex"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.city)}</div></div><span class="pill ${isPaid(p.id)?'paid':''}">${isPaid(p.id)?'Bezahlt':'Offen'}</span></div><div class="rowline"><strong>${money(amountFor(p))} · ${esc(monthLabel())}</strong></div><div class="actions"><button class="btn secondary small" onclick="togglePaid('${p.id}')">Als ${isPaid(p.id)?'offen':'bezahlt'} markieren</button><button class="btn secondary small" onclick="propertyForm('${p.id}')">Bearbeiten</button><button class="btn danger small" onclick="deleteProperty('${p.id}')">Löschen</button>${!isPaid(p.id)?`<button class="btn small" onclick="letterForm('${p.id}','Zahlungserinnerung')">Erinnerung</button>`:''}</div></div>`).join('')||'<div class="panel">Noch keine Immobilien. Tippe auf „Hinzufügen“.</div>';out+=`<div class="panel"><h3>Zahlungshistorie</h3><p class="muted">Gespeicherte Einträge je Immobilie und Monat. Fehlende Monate sind noch nicht als Datensatz angelegt.</p>${state.payments.slice().sort((a,b)=>b.month.localeCompare(a.month)).slice(0,30).map(r=>`<div class="rowline flex"><div><b>${esc(propName(r.property_id))}</b><div class="muted">${esc(r.month.slice(0,7))} · ${money(r.amount)}</div></div><span class="pill ${r.paid?'paid':''}">${r.paid?'Bezahlt':'Offen'}</span></div>`).join('')||'<div class="muted">Noch keine Zahlungen erfasst.</div>'}</div>`}
else if(tab==='tenants'){out=`<div class="flex"><div class="heading">Mieterverwaltung</div><button class="btn small" onclick="tenantForm()">+ Mieter</button></div><div class="notice">Mieterdaten werden in Supabase gespeichert. Bitte zunächst nur Testdaten verwenden, bis die Sicherheitsprüfung mit zwei Konten abgeschlossen ist.</div>`;out+=state.tenants.map(t=>`<div class="panel"><div class="flex"><div><b>${esc(t.full_name)}</b><div class="muted">${esc(propName(t.property_id))}</div></div></div><div class="rowline"><div>Vertragsbeginn: ${esc(t.lease_start||'Nicht angegeben')}</div><div>Kaltmiete: ${money(t.base_rent)} · Nebenkosten: ${money(t.utilities)}</div><div>Kaution: ${money(t.deposit)}</div></div><div class="actions"><button class="btn secondary small" onclick="tenantForm('${t.id}')">Bearbeiten</button><button class="btn danger small" onclick="deleteTenant('${t.id}')">Löschen</button></div></div>`).join('')||'<div class="panel">Noch keine Mieter erfasst.</div>'}
else if(tab==='damage'){out=`<div class="flex"><div class="heading">Schadensverwaltung</div><button class="btn small" onclick="damageForm()">+ Schaden</button></div><div class="notice">Schadenseinträge werden derzeit nur auf diesem Gerät gespeichert, nicht in Supabase.</div>`;out+=state.damages.map(d=>`<div class="panel"><div class="flex"><b>${esc(d.title)}</b><span class="pill ${d.status==='Erledigt'?'paid':''}">${esc(d.status)}</span></div><div class="muted">${esc(propName(d.propertyId))} · ${esc(d.date)}</div><p>${esc(d.description)}</p><div class="actions"><button class="btn secondary small" onclick="damageForm('${d.id}')">Bearbeiten</button><button class="btn danger small" onclick="deleteDamage('${d.id}')">Löschen</button></div></div>`).join('')||'<div class="panel">Noch keine Schäden erfasst.</div>'}
else if(tab==='docs'){out=`<div class="flex"><div class="heading">Dokumentenübersicht</div><button class="btn small" onclick="uploadForm()">+ Datei</button></div><div class="notice">PDFs und Bilder werden im privaten Supabase-Speicher abgelegt. Bis die Zugriffsrechte mit zwei Konten getestet sind, bitte nur Testdateien hochladen. Bisherige lokale Dokumenteinträge bleiben erhalten.</div>`;out+=state.files.map(d=>`<div class="panel"><b>📄 ${esc(d.name.replace(/^[0-9a-f-]{36}_/,''))}</b><div class="muted">${esc(propName(d.propertyId))}</div><div class="actions"><button class="btn secondary small" onclick="openDocument('${d.path}')">Öffnen</button><button class="btn danger small" onclick="deleteDocument('${d.path}')">Löschen</button></div></div>`).join('');out+=`<div class="heading" style="font-size:16px">Ältere Einträge (nur auf diesem Gerät)</div><button class="btn secondary small" onclick="docForm()">+ Eintrag ohne Datei</button>`;out+=state.docs.map(d=>`<div class="panel"><b>▤ ${esc(d.title)}</b><div class="muted">${esc(d.type)} · ${esc(propName(d.propertyId))} · ${esc(d.date)}</div><div class="actions"><button class="btn secondary small" onclick="docForm('${d.id}')">Bearbeiten</button><button class="btn danger small" onclick="deleteDoc('${d.id}')">Löschen</button></div></div>`).join('')||'<div class="panel">Noch keine Dokumenteinträge.</div>'}
else if(tab==='plans'){out=`<div class="heading">Dein Tarif</div><div class="notice">Demo-Tarife. Es werden keine Zahlungen ausgelöst und keine Abos abgeschlossen. Tariflimits sind noch nicht serverseitig durchgesetzt.</div><div class="panel"><b>Aktueller Demo-Tarif: ${demoPlan==='free'?'Free':demoPlan==='plus'?'Plus':'Premium'}</b></div>`;[['free','Free','0 €','1 Immobilie (geplant)'],['plus','Plus','9,99 € / Monat','Bis zu 5 Immobilien (geplant)'],['premium','Premium','19,99 € / Monat','Unbegrenzte Immobilien (geplant)']].forEach(x=>out+=`<div class="panel"><div class="flex"><h3>${x[1]}</h3><strong>${x[2]}</strong></div><p class="muted">${x[3]}</p><button class="btn secondary" onclick="choosePlan('${x[0]}')">${demoPlan===x[0]?'Aktueller Demo-Tarif':'In Demo auswählen'}</button></div>`)}
else{out=`<div class="heading">Schreibassistent</div><div class="notice">KI-Schreibassistent: Erstellt individuelle Entwürfe über OpenAI. Keine Rechtsberatung. Texte vor Versand prüfen. Bitte keine personenbezogenen oder vertraulichen Daten eingeben.</div><div class="panel"><label>Immobilie</label><select id="letterProperty">${opts(state.properties[0]?.id)}</select><label>Art des Schreibens</label><select id="letterType"><option>Zahlungserinnerung</option><option>Schadensmeldung an Hausverwaltung</option><option>Handwerkeranfrage</option></select><label>Empfänger (optional)</label><input id="letterRecipient" placeholder="z. B. Frau Müller"><label>Zusätzliche Informationen</label><textarea id="letterExtra" maxlength="1500" placeholder="Nur anonymisierte Angaben, z. B. Frist oder gewünschter Ton"></textarea><div class="actions"><button class="btn" id="generateLetterButton" onclick="generateLetter()">KI-Schreiben erstellen</button></div></div><div id="letterOutput"></div>`}$('#screen').innerHTML=out}
function tenantForm(id){if(!state.properties.length){notify('Bitte zuerst eine Immobilie anlegen');return}let t=state.tenants.find(x=>x.id===id)||{property_id:state.properties[0].id,full_name:'',lease_start:'',base_rent:0,utilities:0,deposit:0};openModal(id?'Mieter bearbeiten':'Mieter hinzufügen',`<form id="tenantForm"><label>Immobilie</label><select name="property_id" required>${opts(t.property_id)}</select><label>Vollständiger Name</label><input name="full_name" required maxlength="150" value="${esc(t.full_name)}"><label>Mietbeginn</label><input name="lease_start" type="date" value="${esc(t.lease_start||'')}"><label>Kaltmiete (€)</label><input name="base_rent" type="number" min="0" step="0.01" required value="${Number(t.base_rent||0)}"><label>Nebenkosten (€)</label><input name="utilities" type="number" min="0" step="0.01" required value="${Number(t.utilities||0)}"><label>Kaution (€)</label><input name="deposit" type="number" min="0" step="0.01" required value="${Number(t.deposit||0)}"><div class="actions"><button class="btn" type="submit">Speichern</button><button class="btn secondary" type="button" onclick="closeModal()">Abbrechen</button></div></form>`);$('#tenantForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;let f=new FormData(e.target),data={property_id:String(f.get('property_id')),full_name:String(f.get('full_name')).trim(),lease_start:f.get('lease_start')||null,base_rent:Number(f.get('base_rent')),utilities:Number(f.get('utilities')),deposit:Number(f.get('deposit'))};try{if(!prop(data.property_id))throw Error('Ungültige Immobilie');let r=id?await client.from('tenants').update(data).eq('id',id).eq('user_id',user.id):await client.from('tenants').insert({...data,user_id:user.id});if(r.error)throw r.error;closeModal();await refresh();notify('Mieter in Supabase gespeichert')}catch(err){fail(err)}finally{busy=false}}}
async function deleteTenant(id){if(!confirm('Mietereintrag wirklich löschen?'))return;if(busy)return;busy=true;try{let r=await client.from('tenants').delete().eq('id',id).eq('user_id',user.id);if(r.error)throw r.error;await refresh();notify('Mieter gelöscht')}catch(e){fail(e)}finally{busy=false}}
function choosePlan(p){demoPlan=p;saveLocal();notify('Demo-Tarif ausgewählt – kein Kauf')}
function propertyForm(id){let p=prop(id)||{name:'',city:'',rent:0};openModal(id?'Immobilie bearbeiten':'Immobilie hinzufügen',`<form id="propertyForm"><label>Name / Adresse</label><input name="name" maxlength="100" required value="${esc(p.name)}"><label>Stadt / weitere Adresse</label><input name="city" maxlength="200" value="${esc(p.city)}"><label>Monatliche Gesamtmiete (€)</label><input name="rent" type="number" min="0" step="0.01" required value="${p.rent}"><div class="actions"><button class="btn">Speichern</button><button type="button" class="btn secondary" onclick="closeModal()">Abbrechen</button></div></form>`);$('#propertyForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;let f=new FormData(e.target),data={name:String(f.get('name')).trim(),address:String(f.get('city')).trim(),monthly_rent:Number(f.get('rent'))};try{let r=id?await client.from('properties').update(data).eq('id',id).eq('user_id',user.id):await client.from('properties').insert({...data,user_id:user.id});if(r.error)throw r.error;closeModal();await refresh();notify('Immobilie in Supabase gespeichert')}catch(err){fail(err)}finally{busy=false}}}
async function togglePaid(id){if(busy)return;let p=prop(id);if(!p)return;busy=true;let record=paymentFor(id),paid=!isPaid(id);try{let data={property_id:id,user_id:user.id,month:monthDate(),amount:record?Number(record.amount):p.rent,paid};let result=record?await client.from('rent_payments').update({paid}).eq('id',record.id).eq('user_id',user.id):await client.from('rent_payments').insert(data);if(result.error)throw result.error;await refresh();notify('Mietzahlung in Supabase gespeichert')}catch(e){fail(e)}finally{busy=false}}
async function deleteProperty(id){if(state.tenants.some(t=>t.property_id===id)){notify('Bitte zuerst die Mietereinträge dieser Immobilie löschen.');return}if(state.payments.some(p=>p.property_id===id)){notify('Immobilie hat Zahlungseinträge. Bitte vor dem Löschen zuerst die Zahlungshistorie sichern und bereinigen.');return}if(!confirm('Immobilie wirklich löschen? Zugehörige lokale Einträge werden ebenfalls entfernt.'))return;try{let r=await client.from('properties').delete().eq('id',id).eq('user_id',user.id);if(r.error)throw r.error;state.damages=state.damages.filter(d=>d.propertyId!==id);state.docs=state.docs.filter(d=>d.propertyId!==id);delete state.paid[id];saveLocal();await refresh()}catch(e){fail(e)}}
function damageForm(id){if(!state.properties.length){notify('Bitte zuerst eine Immobilie anlegen');return}let d=state.damages.find(x=>x.id===id)||{propertyId:state.properties[0].id,title:'',date:new Date().toISOString().slice(0,10),status:'Offen',description:''};openModal(id?'Schaden bearbeiten':'Schaden erfassen',`<form id="damageForm"><label>Immobilie</label><select name="propertyId">${opts(d.propertyId)}</select><label>Schaden</label><input name="title" required maxlength="100" value="${esc(d.title)}"><label>Datum</label><input name="date" type="date" required value="${esc(d.date)}"><label>Status</label><select name="status">${['Offen','In Bearbeitung','Erledigt'].map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select><label>Beschreibung</label><textarea name="description" maxlength="2000">${esc(d.description)}</textarea><div class="actions"><button class="btn">Speichern</button></div></form>`);$('#damageForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:id||crypto.randomUUID(),propertyId:f.get('propertyId'),title:String(f.get('title')).trim(),date:f.get('date'),status:f.get('status'),description:String(f.get('description')).trim()};if(id)state.damages=state.damages.map(x=>x.id===id?obj:x);else state.damages.push(obj);closeModal();saveLocal()}}
function deleteDamage(id){if(confirm('Schaden löschen?')){state.damages=state.damages.filter(d=>d.id!==id);saveLocal()}}
function docForm(id){if(!state.properties.length){notify('Bitte zuerst eine Immobilie anlegen');return}let d=state.docs.find(x=>x.id===id)||{propertyId:state.properties[0].id,title:'',type:'Sonstiges',date:new Date().toISOString().slice(0,10)};openModal(id?'Dokumenteintrag bearbeiten':'Dokumenteintrag hinzufügen',`<form id="docForm"><label>Dokumentname</label><input name="title" required maxlength="120" value="${esc(d.title)}"><label>Kategorie</label><select name="type">${['Mietvertrag','Rechnung','Schadensbericht','Nebenkosten','Sonstiges'].map(s=>`<option ${s===d.type?'selected':''}>${s}</option>`).join('')}</select><label>Immobilie</label><select name="propertyId">${opts(d.propertyId)}</select><label>Datum</label><input name="date" type="date" required value="${esc(d.date)}"><div class="actions"><button class="btn">Speichern</button></div></form>`);$('#docForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:id||crypto.randomUUID(),propertyId:f.get('propertyId'),title:String(f.get('title')).trim(),type:f.get('type'),date:f.get('date')};if(id)state.docs=state.docs.map(x=>x.id===id?obj:x);else state.docs.push(obj);closeModal();saveLocal()}}
function deleteDoc(id){if(confirm('Dokumenteintrag löschen?')){state.docs=state.docs.filter(d=>d.id!==id);saveLocal()}}
function letterForm(id,type){tab='letters';render();$('#letterProperty').value=id;$('#letterType').value=type;}
async function generateLetter(){
  const p=prop($('#letterProperty').value);
  if(!p || !user){notify('Bitte zuerst eine Immobilie auswählen');return;}
  const button=$('#generateLetterButton'), output=$('#letterOutput');
  if(button.disabled)return;
  const uid=user.id, type=$('#letterType').value, recipient=$('#letterRecipient').value.trim(), extra=$('#letterExtra').value.trim();
  const month=monthLabel(), amount=money(amountFor(p)), paid=isPaid(p.id);
  if(type==='Zahlungserinnerung' && paid && !confirm('Die Miete ist als bezahlt markiert. Trotzdem einen Entwurf erstellen?'))return;
  const message=[
    'Erstelle einen professionellen, freundlichen deutschen Briefentwurf für einen Vermieter. Art: '+type+'.',
    'Verwende die Platzhalter [EMPFÄNGER], [IMMOBILIE] und [Ihr Name]. Keine erfundenen Tatsachen, Fristen oder Rechtsbehauptungen. Gib nur den Brief mit Betreff zurück.',
    type==='Zahlungserinnerung'?'Monat: '+month+'. Erfasster Mietbetrag: '+amount+'. Zahlungsstatus: '+(paid?'als bezahlt markiert; keine offene Forderung behaupten':'als offen markiert; Zahlungseingang nicht automatisch geprüft'):'',
    extra?'Zusätzliche anonymisierte Angaben: '+extra:''
  ].filter(Boolean).join('\n');
  button.disabled=true;button.textContent='KI erstellt Entwurf …';
  output.textContent='Bitte kurz warten …';
  try{
    const {data:auth,error:authError}=await client.auth.getSession();
    if(authError || !auth.session)throw Error('Bitte erneut anmelden.');
    const {data,error}=await client.functions.invoke('mietpilot-ai-assistant',{body:{message},headers:{Authorization:'Bearer '+auth.session.access_token}});
    if(error)throw error;
    if(!data?.success || typeof data.answer!=='string' || !data.answer.trim())throw Error('Keine gültige KI-Antwort erhalten.');
    if(user?.id!==uid || !output.isConnected)return;
    const result=data.answer.replaceAll('[EMPFÄNGER]',()=>recipient||'Damen und Herren').replaceAll('[IMMOBILIE]',()=>[p.name,p.city].filter(Boolean).join(', '));
    output.innerHTML='<div class="panel"><b>Dein KI-Entwurf</b><textarea id="letterText" style="min-height:320px;margin-top:12px"></textarea><div class="actions"><button class="btn" onclick="copyLetter()">Text kopieren</button></div></div>';
    $('#letterText').value=result;
  }catch(e){if(user?.id===uid && output.isConnected){output.textContent='KI-Anfrage fehlgeschlagen. Bitte erneut versuchen oder die Edge Function prüfen.';notify('KI-Anfrage fehlgeschlagen');}}
  finally{button.disabled=false;button.textContent='KI-Schreiben erstellen';}
}
async function copyLetter(){let t=$('#letterText');try{await navigator.clipboard.writeText(t.value);notify('Text kopiert')}catch{t.select();notify('Text markiert – bitte kopieren')}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#logout').onclick=async()=>{let {error}=await client.auth.signOut();if(error)fail(error)};
(async()=>{try{if(!window.supabase)throw Error('Supabase-Bibliothek konnte nicht geladen werden');client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);client.auth.onAuthStateChange((event,session)=>{if(event==='INITIAL_SESSION'||event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(()=>sessionChanged(session),0);if(event==='PASSWORD_RECOVERY')setTimeout(()=>{let password=prompt('Neues Passwort (mindestens 6 Zeichen):');if(password&&password.length>=6)client.auth.updateUser({password}).then(({error})=>error?fail(error):notify('Passwort geändert'))},0)});}catch(e){$('#screen').innerHTML='<div class="panel">Startfehler: '+esc(e.message)+'</div>'}})();

</script>
<script>
const originalRefresh = refresh;
const originalRender = render;

function localDamages() {
  const data = JSON.parse(localStorage.getItem(localKey()) || '{}');
  return data.damages || [];
}

saveLocal = function() {
  localStorage.setItem(localKey(), JSON.stringify({
    damages: localDamages(),
    docs: state.docs,
    plan: demoPlan
  }));
  render();
};

async function loadDamages() {
  const uid = user.id;
  const {data,error} = await client
    .from('damages')
    .select('*')
    .eq('user_id',uid)
    .order('damage_date',{ascending:false});

  if(error) throw error;
  if(user?.id !== uid) return;

  state.damages = (data || []).map(d => ({
    id:d.id,
    propertyId:d.property_id,
    title:d.title,
    description:d.description,
    date:d.damage_date,
    status:({
      'offen':'Offen',
      'in bearbeitung':'In Bearbeitung',
      'erledigt':'Erledigt'
    })[String(d.status).toLowerCase()] || d.status
  }));
}

refresh = async function() {
  await originalRefresh();
  if(!user) return;
  await loadDamages();
  render();
};

render = function() {
  originalRender();
  if(!user || tab !== 'damage') return;

  const notice = $('#screen .notice');
  if(notice) {
    notice.textContent =
      'Schadensmeldungen werden online in Supabase gespeichert. Bitte zunächst nur Testdaten verwenden.';

    if(localDamages().length) {
      const button = document.createElement('button');
      button.className = 'btn secondary small';
      button.style.marginTop = '10px';
      button.textContent = 'Alte lokale Schäden übernehmen';
      button.onclick = migrateDamages;
      notice.appendChild(document.createElement('br'));
      notice.appendChild(button);
    }
  }
};

async function migrateDamages() {
  if(busy || !user) return;
  if(!confirm('Lokale Schäden in Supabase übernehmen?')) return;
  busy = true;
  const uid = user.id;

  try {
    const pending = localDamages();
    for(const d of pending) {
      if(!prop(d.propertyId)) continue;

      const {error} = await client.from('damages').upsert({
        id:d.id,
        user_id:uid,
        property_id:d.propertyId,
        title:d.title,
        description:d.description || '',
        damage_date:d.date,
        status:String(d.status || 'offen').toLowerCase()
      },{onConflict:'id',ignoreDuplicates:true});

      if(error) throw error;
      if(user?.id !== uid) return;
    }

    await loadDamages();
    if(user?.id !== uid) return;

    const saved = new Set(state.damages.map(d => d.id));
    const data = JSON.parse(localStorage.getItem(localKey()) || '{}');
    data.damages = pending.filter(d => !saved.has(d.id));
    localStorage.setItem(localKey(),JSON.stringify(data));
    render();

    notify(data.damages.length
      ? 'Einige lokale Schäden konnten nicht übernommen werden'
      : 'Lokale Schäden übernommen');

  } catch(e) {
    fail(e);
  } finally {
    busy = false;
  }
}

const originalDamageForm = damageForm;

damageForm = function(id) {
  originalDamageForm(id);
  const form = $('#damageForm');
  if(!form || !user) return;
  const uid = user.id;

  form.onsubmit = async function(e) {
    e.preventDefault();
    if(busy || user?.id !== uid) return;
    busy = true;

    try {
      const f = new FormData(e.target);
      const data = {
        property_id:String(f.get('propertyId')),
        title:String(f.get('title')).trim(),
        damage_date:String(f.get('date')),
        status:String(f.get('status')).toLowerCase(),
        description:String(f.get('description')).trim()
      };

      if(!prop(data.property_id))
        throw Error('Ungültige Immobilie');

      if(!data.title)
        throw Error('Bitte Schadenstitel eingeben');

      const result = id
        ? await client.from('damages')
            .update(data)
            .eq('id',id)
            .eq('user_id',uid)
            .select('id').single()
        : await client.from('damages')
            .insert({...data,user_id:uid})
            .select('id').single();

      if(result.error) throw result.error;
      if(user?.id !== uid) return;

      closeModal();
      await loadDamages();
      render();
      notify('Schaden in Supabase gespeichert');

    } catch(err) {
      fail(err);
    } finally {
      busy = false;
    }
  };
};

deleteDamage = async function(id) {
  if(busy || !user) return;
  if(!confirm('Schaden endgültig löschen?')) return;

  busy = true;
  const uid = user.id;

  try {
    const {error} = await client.from('damages')
      .delete()
      .eq('id',id)
      .eq('user_id',uid)
      .select('id').single();

    if(error) throw error;
    if(user?.id !== uid) return;

    await loadDamages();
    render();
    notify('Schaden gelöscht');

  } catch(e) {
    fail(e);
  } finally {
    busy = false;
  }
};

const originalDeleteProperty = deleteProperty;

deleteProperty = async function(id) {
  try {
    await loadDamages();

    if(state.damages.some(d => d.propertyId === id) ||
       localDamages().some(d => d.propertyId === id)) {
      notify('Bitte zuerst die zugehörigen Schäden bearbeiten oder löschen.');
      return;
    }

    await originalDeleteProperty(id);
  } catch(e) {
    fail(e);
  }
};
</script>
</body>
</html>
